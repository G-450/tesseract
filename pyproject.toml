[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formation-energy-prediction"
version = "0.1.0"
description = "Explainable Graph Neural Network Pipeline for Formation Energy Prediction"
authors = [{name = "Mithul"}]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "pymatgen>=2024.1.27",
    "matminer>=0.9.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "ijson>=3.2.0",
    "pytorch-lightning>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.2.0",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "flake8>=7.0.0",
    "pandas-stubs>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
mypy_path = ["."]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "pytorch_lightning",
    "pytorch_lightning.*",
    "torch_geometric",
    "torch_geometric.*",
    "pymatgen",
    "pymatgen.*",
    "matminer",
    "matminer.*",
    "ijson",
    "pandas",
    "pandas.*",
    "matplotlib",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["."]
